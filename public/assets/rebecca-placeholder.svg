<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2A1F4A"/>
      <stop offset=".55" stop-color="#3B1D45"/>
      <stop offset="1" stop-color="#14111E"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#EC4899"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".38" r=".5">
      <stop offset="0" stop-color="#C6F432" stop-opacity=".35"/>
      <stop offset="1" stop-color="#C6F432" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="1000" fill="url(#bg)"/>
  <circle cx="400" cy="380" r="380" fill="url(#glow)"/>
  <!-- cabelo -->
  <path d="M232 470c-28-170 40-300 168-300s204 120 176 300c-10 70-2 150 30 230H200c34-80 42-160 32-230z" fill="#1A1326" opacity=".9"/>
  <!-- rosto -->
  <ellipse cx="400" cy="400" rx="118" ry="140" fill="url(#body)" opacity=".95"/>
  <path d="M282 360c20-110 220-140 248-10-60-40-150-70-248 10z" fill="#1A1326"/>
  <!-- pescoço e ombros -->
  <path d="M352 520h96v70c0 20-96 20-96 0z" fill="url(#body)" opacity=".85"/>
  <path d="M120 1000c0-200 120-400 280-400s280 200 280 400z" fill="url(#body)"/>
  <path d="M300 640c30 60 170 60 200 0" stroke="#fff" stroke-opacity=".35" stroke-width="6" fill="none" stroke-linecap="round"/>
  <text x="400" y="900" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="44" fill="#fff" fill-opacity=".85">sua foto aqui</text>
</svg>
